# Build targets. Parsed both by the GitHub Actions matrix and by `just build`.
#
# All Corne variants share config/corne.keymap (ZMK resolves the keymap by
# shield-name prefix). `artifact-name` is what keeps the resulting .uf2 files
# apart, since only the shield list differs between the 6-column boards and
# the 5-column nice!view board.
---
include:
  # 6-column Corne, no display (x2 — the two boards are identical)
  - board: nice_nano@2.0.0//zmk
    shield: corne_left
    artifact-name: corne6_left
  - board: nice_nano@2.0.0//zmk
    shield: corne_right
    artifact-name: corne6_right

  # 5-column Corne with nice!view
  - board: nice_nano@2.0.0//zmk
    shield: corne_left nice_view_adapter nice_view
    artifact-name: corne5_view_left
  - board: nice_nano@2.0.0//zmk
    shield: corne_right nice_view_adapter nice_view
    artifact-name: corne5_view_right

  # Handwired 5-column Corne (custom shield, config/boards/shields/)
  - board: nice_nano@2.0.0//zmk
    shield: handwired_corne_left
    artifact-name: handwired_left
  - board: nice_nano@2.0.0//zmk
    shield: handwired_corne_right
    artifact-name: handwired_right
