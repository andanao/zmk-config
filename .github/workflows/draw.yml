name: Draw keymaps

on:
  workflow_dispatch:
  push:
    paths:
      - config/*.keymap
      - config/*.dtsi
      - draw/config.yaml
      - .github/workflows/draw.yml

permissions:
  contents: write

concurrency:
  group: draw-${{ github.ref }}
  cancel-in-progress: true

# This only commits draw/*.svg, and none of the trigger paths above match that,
# so it cannot retrigger itself.
jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # Pinned to an exact release: setup-uv stopped publishing floating major
      # tags after v7, so `@v10` does not resolve even though v10.1.0 exists.
      - uses: astral-sh/setup-uv@v10.1.0

      # Versions are pinned because this workflow commits the regenerated SVGs:
      # an unpinned keymap-drawer would rewrite every diagram the first time it
      # released a rendering change. Keep in step with what `just draw` is run
      # with locally (docs/build-env.md).
      - name: Install tools
        run: |
          uv tool install keymap-drawer==0.23.0
          uv tool install yq==4.1.2
          uv tool install rust-just==1.58.0
          uv tool dir --bin >>"$GITHUB_PATH"

      # keymap-drawer resolves `#include <zmk-helpers/...>` against the west
      # workspace, so the helpers module has to be on disk. Cloning it directly
      # is far cheaper here than a full `west update`; the revision is read from
      # config/west.yml so the two can't drift.
      - name: Fetch zmk-helpers
        run: |
          rev=$(yq -r '.manifest.projects[] | select(.name == "zmk-helpers") | .revision' config/west.yml)
          git clone --filter=blob:none https://github.com/urob/zmk-helpers modules/zmk/helpers
          git -C modules/zmk/helpers checkout "$rev"

      - name: Draw keymaps
        run: just draw

      - name: Commit updated diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- draw; then
            echo "Diagrams already up to date."
            exit 0
          fi
          git add draw
          git commit -m "chore(draw): regenerate keymap diagrams"
          git push
