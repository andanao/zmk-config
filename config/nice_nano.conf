# Settings shared by every keyboard in this repo, all of which are nice!nano v2.
#
# ZMK applies <board>.conf to any build on that board, after the shield-level
# .conf files -- so put only genuinely universal settings here. Anything a
# single keyboard needs to override (the Bluetooth name, for one) has to live
# in a shield .conf instead, or this file would win.

# Deep sleep after 30 minutes idle.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Make Bluetooth stronger.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
