# Applied only to builds whose shield list contains `nice_view`, on top of
# corne.conf. ZMK collects *every* matching <shield>.conf in the config
# directory (app/boards/post_boards_shields.cmake appends rather than stopping
# at the first hit), and later fragments win — which is how this overrides the
# keyboard name for the nice!view board only.
#
# The display itself is enabled by the nice_view shield's own Kconfig.defconfig;
# nothing is needed here for it.

CONFIG_ZMK_KEYBOARD_NAME="Corne View"
