# Applies to every build using ZMK's corne shield: both 6-column boards and the
# 5-column nice!view board. Shared nice!nano settings live in nice_nano.conf.

# Overrides the corne shield's own default of "Corne". There is no shield
# unique to the 6-column boards, so this is the shared default and
# nice_view.conf overrides it for the nice!view board -- see the note there.
CONFIG_ZMK_KEYBOARD_NAME="adrian_corne_6"
