# Shared settings for every Corne build (6-column, 5-column and nice!view).

# Deep sleep after 30 minutes idle.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Make Bluetooth stronger.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Bluetooth / USB name for the plain 6-column boards. There is no shield unique
# to them (they use corne_left/corne_right, which the nice!view builds also
# use), so this is set as the shared default and config/nice_view.conf overrides
# it for the nice!view board. That relies on nice_view.conf being merged last,
# which ZMK does — verified by checking CONFIG_ZMK_KEYBOARD_NAME in the
# generated .config of all four targets. If you add a board that needs its own
# name and can't key off a unique shield, use build.yaml `cmake-args` instead.
CONFIG_ZMK_KEYBOARD_NAME="adrian_corne_6"
